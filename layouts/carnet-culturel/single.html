{{ define "main" }}

{{ $article := . }}

<article class="article-detail-page">
    <div class="article-detail-container">

        <a href='{{ "carnet-culturel/" | relURL }}' class="article-back">
            ← Retour au carnet culturel
        </a>

        <header class="article-detail-header">

            <time
                class="article-detail-date"
                datetime="{{ .Date.Format "2006-01-02" }}">
                {{ time.Format ":date_long" .Date }}
            </time>

            <h1>{{ .Title }}</h1>

            {{ with .GetTerms "tags" }}
            <div class="article-detail-tags">
                {{ range . }}
                <a class="article-tag" href="{{ .RelPermalink }}">
                    {{ .LinkTitle }}
                </a>
                {{ end }}
            </div>
            {{ end }}

        </header>

        {{ with .Params.image }}
        <div class="article-detail-cover">
            <img
                src="{{ . | relURL }}"
                alt="Illustration de {{ $article.Title }}">
        </div>
        {{ end }}

        <div class="article-detail-content">
            {{ .Content }}
        </div>

    </div>
</article>

{{ end }}
