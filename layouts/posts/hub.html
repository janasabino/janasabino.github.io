
{{ define "main" }}

<div class="projects-page">
    <div class="projects-container">

        <header class="projects-header">
            <h1>{{ .Title }}</h1>
            <div class="projects-introduction">
                {{ .Content }}
            </div>
        </header>

        <div class="portfolio-grid">

            {{ range .Params.cards }}

            <a class="portfolio-item category-card"
               href="{{ .url | relURL }}">

                <div class="portfolio-content">

                    <h2>{{ .title }}</h2>

                    <p>{{ .description }}</p>

                    <div class="project-button">
                        <span class="btn btn-secondary">
                            Explorer la rubrique
                        </span>
                    </div>

                </div>

            </a>

            {{ end }}

        </div>

    </div>
</div>

<style>
.category-card,
.category-card:visited {
    color: inherit;
    text-decoration: none;
}

.category-card {
    display: block;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 20px;
    padding: 0;
    min-height: 0;
    height: auto;
    width: min(100%, 520px);
    justify-self: center;
    transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
}

.category-card:hover {
    transform: translateY(-4px);
    border-color: rgba(0, 212, 255, 0.35);
    box-shadow: 0 12px 30px rgba(0, 212, 255, 0.10);
}

.category-card:focus-visible {
    outline: 2px solid rgba(0, 212, 255, 0.8);
    outline-offset: 3px;
}

.category-card .portfolio-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 0.65rem;
    min-height: 0;
    box-sizing: border-box;
    padding: 1.4rem 1.6rem;
}

.category-card h2 {
    margin: 0;
    color: #A9E6FF;
    font-size: 1.75rem;
}

.category-card p {
    margin: 0;
    max-width: 42ch;
    color: rgba(255, 255, 255, 0.82);
    line-height: 1.6;
    font-size: 1rem;
}

.category-card .project-button {
    margin-top: 0.2rem;
}

.category-card .btn {
    display: inline-block;
}
</style>

{{ end }}
