{{ define "main" }}

<section class="hero">
    <div class="hero-profile">

        <div class="hero-photo">
            <img
                src='{{ "images/janaina.jpg" | relURL }}'
                alt="Portrait professionnel de Janaina Sabino">
        </div>

        <div class="hero-content">
            <h1>{{ i18n "hero_greeting" }} {{ .Site.Params.author }}</h1>

            <p>{{ .Site.Params.subtitle }}</p>

            <p>{{ .Site.Params.description }}</p>

            <div class="cta-buttons">
                <a
                    href="https://www.linkedin.com/in/janasabino/"
                    class="btn btn-primary"
                    target="_blank"
                    rel="noopener noreferrer">
                    LinkedIn
                </a>

                <a
                    href="https://github.com/janasabino"
                    class="btn btn-secondary"
                    target="_blank"
                    rel="noopener noreferrer">
                    GitHub
                </a>
            </div>
        </div>

    </div>
</section>

{{ end }}
