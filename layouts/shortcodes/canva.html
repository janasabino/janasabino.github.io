<div class="project-preview">

    <h2>Aperçu du projet</h2>

    <div style="max-width: 900px; margin: 2rem auto;">
        <div style="
            position: relative;
            width: 100%;
            height: 0;
            padding-top: 56.25%;
            overflow: hidden;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(63,69,81,0.16);
        ">
            <iframe
                loading="lazy"
                style="
                    position: absolute;
                    width: 100%;
                    height: 100%;
                    top: 0;
                    left: 0;
                    border: none;
                "
                src="{{ .Get "src" }}"
                allowfullscreen
                allow="fullscreen">
            </iframe>
        </div>
    </div>

</div>
